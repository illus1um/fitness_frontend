name: fitness_app
description: "Fitness App с FastAPI аутентификацией"
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^0.13.4
  rename: ^3.0.2
  shared_preferences: ^2.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/exercises.json
    - assets/gifs/
    - assets/muscle_groups/
    - assets/workout_exercise.json
    - assets/ideal.json
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/strenvy_icon.png"
  adaptive_icon_foreground: assets/icons/strenvy_icon.png
  adaptive_icon_background: "#000000"

flutter_native_splash:
  color: "#000000"
  image: assets/icons/splash_logo.png
  branding: assets/icons/splash_text.png
  branding_mode: bottom 
  android: true
  ios: true